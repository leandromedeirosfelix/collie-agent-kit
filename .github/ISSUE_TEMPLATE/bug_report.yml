name: Bug report
description: Something in the agent kit does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **never paste a token** or review contents you are not allowed to share.
        Security vulnerabilities go to contact@colliesr.com, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask the agent: "..."
        2. The agent calls ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code (plugin)
        - Claude Code (MCP server only)
        - Claude Desktop
        - Codex
        - Gemini CLI
        - Cursor
        - Perplexity (Mac app)
        - Own code (MCP SDK)
        - Other
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client version
  - type: input
    id: kit-version
    attributes:
      label: Kit version
      description: The version in package.json, or the plugin version shown by /plugin in Claude Code.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Output of node --version
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install or start-up
        - Connecting (collie_connect, tokens)
        - An MCP tool
        - Skill or subagent
        - Hooks
        - /collie pane or status line
        - Documentation
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Error text or logs
      description: Remove tokens and personal data first.
      render: text
